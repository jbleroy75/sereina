# Sereina sur Cloudflare Workers : construit le site, lance les tests d'API (serveur Node ET Worker local),
# puis déploie le Worker « sereina » sur workers.dev (push sur main ou lancement manuel).
# La production reste sur Coolify tant que la route de domaine est commentée dans worker/wrangler.jsonc.
name: Deploy Cloudflare

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SITE_URL: https://sereina.cf-security.workers.dev
  CLOUDFLARE_ACCOUNT_ID: 8c94210e52e29b4d4ed4c4f743d65431

jobs:
  test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Construire le site et les guides PDF
        run: |
          pip install markdown pyyaml reportlab pillow
          python build.py --site-url "$SITE_URL"
          python build_guides.py --site-url "$SITE_URL" --out private/guides

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Dépendances
        run: |
          npm ci --prefix server
          npm ci --prefix worker
      - name: Fichiers embarqués et en-têtes statiques
        run: npm run build --prefix worker

      - name: Tests d'API (serveur Node)
        run: npm test
      - name: Tests d'API (Worker local, wrangler dev)
        run: npm run test:worker

      - name: Déployer sur workers.dev
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
